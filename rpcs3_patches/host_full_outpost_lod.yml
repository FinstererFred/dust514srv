# Entwurf (ungetestet): Listen-Host lädt alle Detailstufen aller Outposts.
# Nur in die Patch-Datei des HOSTS eintragen (D:\rpcs3\patches\NPUB30643_patch.yml bzw. Docker-Host),
# nicht bei Client 2 (D:\rpcs3_b). Herleitung: docs/battle_feasibility.md, Abschnitt
# „Live-Kombinationen und Kollision fern vom Host“.
#
# FUN_0085ed78 (Outpost-LOD-Manager) lädt pro Outpost-Socket alle LOD-Einträge mit Index <= Ziel-Index
# (Socket+0x20). Index 0 ist der _LOD0-Proxy, die vollen Ebenen X / X+AU kommen danach. Der Ziel-Index
# hängt am Blickpunkt des Hosts. Der Patch ersetzt das Lesen des Ziel-Index durch 0x7fff0000.
# Die Stufen werden weiter nacheinander geladen (der Manager wartet, bis die vorige Stufe sichtbar ist).
#
#   0x0085f12c  80980020  lwz r4,0x20(r24)   ->  3c807fff  lis r4,0x7fff
#
# Das allein reicht nicht (Test 2026-10-26): Das Überblend-System FUN_0099aa18 blendet den _LOD0-Proxy nur nahe am
# eigenen Blickpunkt aus, und ein ausgeblendeter Actor verliert seine Kollision (FUN_001a6158). Ein Client hat an
# seiner Position also nur die Detailgeometrie, der Host dort weiter den Proxy -> Pawn steht auf dem Server auf dem
# Proxy, auf dem Client fällt er ("hängt in der Luft"). Zweite Zeile: jeder Cluster gilt als nah.
#
#   0x0099aaf0  3b00ffff  li r24,-1          ->  3b000001  li r24,1   (Patch 0.2, in 0.3 ersetzt)
#
# Patch 0.3 (ungetestet): Statt „jeder Cluster ist nah“ zwei Code-Höhlen (RPCS3 calloc), die alle Spielfiguren aus
# WorldInfo.PawnList einbeziehen. Erzeugt mit research/tools_local/cave_asm.py, dort steht die Herleitung.
#   - 0x0099ae94 (FUN_0099ac80): Abstand Cluster <-> Blickpunkt wird zum kleinsten Abstand über Blickpunkt und alle
#     Pawns. Ein Cluster gilt also als nah, wenn irgendein Spieler nah ist. Innere Cluster fern von allen bleiben grob.
#   - 0x00820088 (FUN_0081ffb4): ruft FUN_00815548 zusätzlich für jeden Pawn auf, die Funktion behält pro
#     Terrain-Teil die feinste Stufe. Die MegaTerrain-Kollision ist dann an allen Spielerpositionen fein.
#   - 0x007fb7bc (FUN_007fb450, Patch 0.5): verfeinert die MegaTerrain-Kollisionskacheln (FUN_008240e8) in jedem Tick
#     zusätzlich um jeden Pawn. Test 4: Die Höhle bei 0x820088 verfeinert die Kollision nicht. Test 5: Patch 0.4 hing in
#     FUN_007f9b54, das nur bei Ereignis 0x2f läuft, und half ebenfalls nicht.
# Zurück auf 0.2: alle calloc-Blöcke durch die alte Zeile 0x0099aaf0 ersetzen.

