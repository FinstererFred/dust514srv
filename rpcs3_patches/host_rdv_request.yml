# Fahrzeug-Anforderung (RDV) auf dem Listen-Host zulassen. Patch 0.2 getestet (2026-10-31): LAV in Skirmish spawnt
# und fährt. Panzer und Dropships spawnen ebenfalls (0.2 noch auf dem Anforderer, siehe 0.3).
# Nur in die Patch-Datei des HOSTS eintragen (D:\rpcs3\patches\NPUB30643_patch.yml bzw. Docker-Host).
# Die Anforderung läuft serverseitig (DustPlayerController.DeployPendingVehicle -> native HandleRDVRequest).
#
# Kette (Ghidra, EBOOT 03.19):
#   execHandleRDVRequest 0x014f3410 -> vtable ADustControllerSharedComponent (0x01959ac8) Slot 0x3fc
#   -> FUN_006ea594 (HandleRDVRequest): Versorgungsdepot-Zweig (GetRDVLocationPoint) oder
#   -> FUN_007cc670 (UDustSvcRDV, Anforderung prüfen und in die Warteschlange stellen)
#   -> bl FUN_000e4cb0 = "li r3,2; blr": die Prüfung ist im Release-Build ein Stub und liefert immer
#      RDVR_Denied_InvalidLocation (2). Ergebnis != 0 -> Abbruch, Fitting zurück ins Inventar.
#   Danach echter Code: Abstand zu anderen RDVs (FUN_007cb9b8), Warteschlange (FUN_007cc4a8), Benachrichtigungen.
#
# Der Stub ist vermutlich mit anderen "return 2"-Funktionen zusammengelegt, deshalb wird die Aufrufstelle
# gepatcht, nicht der Stub:
#   0x007cc6ec  4b9185c5  bl 0x000e4cb0  ->  38600000  li r3,0   (RDVR_Accepted)
#
# Nebenwirkung: Die herausgekürzte Prüfung enthielt vermutlich auch die Quoten (Team, Trupp, Spieler, War Points).
#
# Patch 0.2 (Test 0.1: "queued", aber kein Dropship): Die Abarbeitung FUN_007cbb90 (UDustSvcRDV, vtable 0x1984c18
# Slot 0x154) entfernt einen fälligen Eintrag nur noch (FUN_01575b78), der Auslieferungs-Aufruf fehlt im Release.
# Code-Höhle auf 0x7cbcc4 (nur für fällige Einträge, r26 = Eintrag) ruft vorher FUN_007b61a4
# (ADustSpawner::SpawnAndFitVehicle, vollständiger Code) mit typeID, Fitting, Team und Ort aus dem Eintrag auf, Ort
# +500 in X und Z. Kein Dropship, das Fahrzeug fällt neben dem Anforderer herunter. Erzeugt mit
# research/tools_local/rdv_cave.py. Dazu gehört dustdevhook (Python): nach einer angenommenen Anforderung das
# "pending"-Fitting ohne Rückerstattung löschen, sonst lehnt battleServer jede weitere mit requestNotFinish ab.
#
# Patch 0.3 (Test 0.2: LAV gut, Panzer und Dropships landen auf dem Anforderer und töten ihn): Ort jetzt +1024 in X
# und Y (~14,5 m schräg daneben) und +768 in Z. Ein echter Dropship-Anflug ist nicht nachrüstbar ohne eigene Flug-
# logik: DustAIBehaviour_RDV (vtable 0x19b3a40, InternalConstructor 0x15e7fe8) hat im Release nur die 84 UObject-Slots.

